apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hotel-management.fullname" . }}
  labels:
    {{- include "hotel-management.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_ENV: {{ .Values.app.env | quote }}
  APP_DEBUG: {{ .Values.app.debug | quote }}
  APP_URL: {{ .Values.app.url | quote }}
  LOG_CHANNEL: {{ .Values.app.logChannel | quote }}
  LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  CACHE_DRIVER: {{ .Values.app.cacheDriver | quote }}
  SESSION_DRIVER: {{ .Values.app.sessionDriver | quote }}
  SESSION_LIFETIME: {{ .Values.app.sessionLifetime | quote }}
  QUEUE_CONNECTION: {{ .Values.app.queueConnection | quote }}
  BROADCAST_DRIVER: {{ .Values.app.broadcastDriver | quote }}
  DB_CONNECTION: {{ .Values.database.connection | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_DATABASE: {{ .Values.database.name | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  MAIL_MAILER: {{ .Values.mail.mailer | quote }}
  MAIL_HOST: {{ .Values.mail.host | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
  MAIL_USERNAME: {{ .Values.mail.username | quote }}
  MAIL_ENCRYPTION: {{ .Values.mail.encryption | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.mail.fromAddress | quote }}
  MAIL_FROM_NAME: {{ default .Values.app.name .Values.mail.fromName | quote }}
  # Migrations run as a Helm hook Job, never from the pod entrypoint.
  RUN_MIGRATIONS: "false"
