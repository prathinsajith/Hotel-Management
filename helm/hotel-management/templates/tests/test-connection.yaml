apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "hotel-management.fullname" . }}-test-connection"
  labels:
    {{- include "hotel-management.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - "-q"
        - "-O"
        - "-"
        - "{{ include "hotel-management.fullname" . }}:{{ .Values.service.port }}/healthz"
