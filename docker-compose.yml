# Local stack for the Hotel Management app.
# The app image is built from the repo's own Dockerfile (nginx + php-fpm).
#
#   docker compose up --build      -> http://localhost:8080
#
# Note: the app image bakes in code and vendor/ — there is no bind mount of the
# source, so rebuild (`docker compose up --build`) after changing PHP code.

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                PHP_VERSION: '${PHP_VERSION:-8.4}'
        image: hotel-management:local
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8080}:80'
        env_file:
            - .env
        environment:
            # These win over .env, so the container always talks to the
            # service containers below rather than to a host/sqlite database.
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${MYSQL_DATABASE:-hotel_management}'
            DB_USERNAME: '${MYSQL_USER:-hotel}'
            DB_PASSWORD: '${MYSQL_PASSWORD:-secret}'
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_PASSWORD: 'null'
            MAIL_HOST: mailhog
            MAIL_PORT: 1025
            # Run `php artisan migrate --force` on start. Set to "false" to skip.
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
        volumes:
            # Uploads land in public/images (AdminController) — keep them on the host.
            - './public/images:/var/www/html/public/images'
            - 'app-storage:/var/www/html/storage'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - hotel

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-secret}'
            MYSQL_DATABASE: '${MYSQL_DATABASE:-hotel_management}'
            MYSQL_USER: '${MYSQL_USER:-hotel}'
            MYSQL_PASSWORD: '${MYSQL_PASSWORD:-secret}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${MYSQL_ROOT_PASSWORD:-secret}']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - hotel

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis-data:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - hotel

    mailhog:
        image: 'mailhog/mailhog:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILHOG_PORT:-1025}:1025'
            - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
        networks:
            - hotel

networks:
    hotel:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    app-storage:
        driver: local
